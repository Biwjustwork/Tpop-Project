<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load Balancer - Plu Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a12;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      border: 3px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      background: #0a0f1a;
    }
    canvas { display: block; background: #060a12; }
    .ui-overlay {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      pointer-events: none;
      color: #00f0ff;
      text-shadow: 0 0 5px #00f0ff;
    }
    .instructions {
      margin-top: 12px;
      font-size: 0.6rem;
      color: #8e9bb0;
      text-align: center;
      line-height: 1.8;
    }
    .instructions b { color: #00ff66; }
  </style>
</head>
<body>

<div id="gameContainer">
  <div class="ui-overlay">
    <div>HANDLED: <span id="scoreText">0</span></div>
    <div>DEV: PLU (200)</div>
  </div>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
</div>
<p class="instructions">
  🖥️ Route incoming API requests to the matching server!<br>
  Press <b>1</b> / <b>2</b> / <b>3</b> (or tap a lane) when a packet reaches the sync line.
</p>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreText = document.getElementById('scoreText');

  // --- Server / lane config (backend theme) ---
  const LANES = [
    { name: 'SRV-1', color: '#00f0ff', x: 100 },
    { name: 'SRV-2', color: '#ff007f', x: 300 },
    { name: 'SRV-3', color: '#00ff66', x: 500 }
  ];
  const SYNC_Y = 320;          // ideal processing line
  const ZONE = 40;             // hit tolerance (px above/below sync line)
  const GROUND_Y = 372;        // packet lost below this
  const PACKET = 26;

  let packets = [];
  let score = 0;
  let uptime = 100;            // health, drops on lost/wrong requests
  let spawnTimer = 0;
  let gameOver = false;
  let flashes = [];            // status-code popups (200 / 503 / 400)

  function reset() {
    packets = [];
    score = 0;
    uptime = 100;
    spawnTimer = 0;
    gameOver = false;
    flashes = [];
  }

  function difficulty() {
    // ramps speed + spawn frequency as more requests are handled
    return {
      speed: 2.2 + score * 0.04,
      interval: Math.max(38, 85 - score * 0.9)
    };
  }

  function spawnPacket() {
    const lane = Math.floor(Math.random() * LANES.length);
    packets.push({ lane, y: -PACKET, active: true });
  }

  function addFlash(x, text, color) {
    flashes.push({ x, y: SYNC_Y, text, color, life: 40 });
  }

  // Route the lowest active packet currently inside the sync zone of a lane
  function route(laneIndex) {
    if (gameOver) return;
    let best = null;
    for (const p of packets) {
      if (p.lane === laneIndex && p.active && Math.abs(p.y - SYNC_Y) <= ZONE) {
        if (!best || p.y > best.y) best = p;
      }
    }
    if (best) {
      best.active = false;
      score++;
      scoreText.textContent = score;
      addFlash(LANES[laneIndex].x, '200 OK', '#00ff66');
    } else {
      // misfire: routed to a server with no pending request
      uptime -= 4;
      addFlash(LANES[laneIndex].x, '400', '#ffe600');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Digit1') route(0);
    else if (e.code === 'Digit2') route(1);
    else if (e.code === 'Digit3') route(2);
    else if (e.code === 'Space' && gameOver) { e.preventDefault(); reset(); }
  });

  canvas.addEventListener('click', (e) => {
    if (gameOver) { reset(); return; }
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    route(cx < 200 ? 0 : cx < 400 ? 1 : 2);
  });

  function update() {
    if (gameOver) return;
    const { speed, interval } = difficulty();

    spawnTimer++;
    if (spawnTimer >= interval) {
      spawnTimer = 0;
      spawnPacket();
    }

    for (const p of packets) {
      if (!p.active) continue;
      p.y += speed;
      if (p.y > GROUND_Y) {
        p.active = false;
        uptime -= 12;               // dropped request (503)
        addFlash(LANES[p.lane].x, '503', '#ff3355');
      }
    }
    packets = packets.filter(p => p.active || false);

    flashes.forEach(f => { f.y -= 0.6; f.life--; });
    flashes = flashes.filter(f => f.life > 0);

    if (uptime <= 0) { uptime = 0; gameOver = true; }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sync line (load-balancer processing line)
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, SYNC_Y);
    ctx.lineTo(canvas.width, SYNC_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Lane dividers + servers
    LANES.forEach((lane, i) => {
      if (i > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(i * 200, 0);
        ctx.lineTo(i * 200, canvas.height);
        ctx.stroke();
      }

      // Server box
      const w = 130, h = 30, sx = lane.x - w / 2, sy = 378;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(sx, sy, w, h);
      ctx.strokeStyle = lane.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, sy, w, h);
      ctx.fillStyle = lane.color;
      ctx.font = '9px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText(lane.name, lane.x, sy + 19);
      // lane key hint
      ctx.fillText('[' + (i + 1) + ']', lane.x, sy - 8);
    });

    // Packets (request data blocks)
    packets.forEach(p => {
      if (!p.active) return;
      const lane = LANES[p.lane];
      const px = lane.x - PACKET / 2;
      ctx.fillStyle = lane.color;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(px, p.y, PACKET, PACKET);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(px, p.y, PACKET, PACKET);
      // packet glyph
      ctx.fillStyle = '#060a12';
      ctx.font = '10px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('{}', lane.x, p.y + 17);
    });

    // Status-code flashes
    flashes.forEach(f => {
      ctx.globalAlpha = Math.max(0, f.life / 40);
      ctx.fillStyle = f.color;
      ctx.font = '10px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    });

    // Uptime bar (health)
    const barW = 180, barX = canvas.width - barW - 16, barY = 44;
    ctx.fillStyle = '#8e9bb0';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'right';
    ctx.fillText('UPTIME', canvas.width - 16, barY - 6);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(barX, barY, barW, 10);
    const c = uptime > 50 ? '#00ff66' : uptime > 25 ? '#ffe600' : '#ff3355';
    ctx.fillStyle = c;
    ctx.fillRect(barX, barY, barW * (uptime / 100), 10);

    // Game over overlay
    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3355';
      ctx.font = '16px "Press Start 2P"';
      ctx.fillText('500', canvas.width / 2, canvas.height / 2 - 40);
      ctx.font = '11px "Press Start 2P"';
      ctx.fillText('INTERNAL SERVER ERROR', canvas.width / 2, canvas.height / 2 - 12);
      ctx.fillStyle = '#00f0ff';
      ctx.font = '9px "Press Start 2P"';
      ctx.fillText('Requests handled: ' + score, canvas.width / 2, canvas.height / 2 + 20);
      ctx.fillStyle = '#fff';
      ctx.fillText('Press SPACE to redeploy', canvas.width / 2, canvas.height / 2 + 44);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>
