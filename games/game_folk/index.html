<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Defender - Folk Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a12;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      border: 3px solid #8a2be2;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
      background: #0f071a;
    }
    canvas { display: block; background: #07040e; }
    .ui-overlay {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      pointer-events: none;
      color: #c084fc;
      text-shadow: 0 0 5px #8a2be2;
    }
    .instructions {
      margin-top: 12px;
      font-size: 0.6rem;
      color: #8e9bb0;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <div class="ui-overlay">
    <div>KILLS: <span id="scoreText">0</span></div>
    <div>DEV: FOLK (193)</div>
  </div>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
</div>
<p class="instructions">🎮 Move Mouse to aim spaceship, Click to shoot lasers at enemy drones!</p>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreText = document.getElementById('scoreText');

  let score = 0;
  const ship = { x: canvas.width / 2, y: canvas.height - 40, size: 24 };

  const lasers = [];
  const enemies = [];

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    ship.x = e.clientX - rect.left;
  });

  canvas.addEventListener('click', () => {
    lasers.push({ x: ship.x, y: ship.y - 10, speed: 8, radius: 4 });
  });

  function spawnEnemy() {
    enemies.push({
      x: Math.random() * (canvas.width - 30) + 15,
      y: -20,
      size: 20,
      speed: 1.5 + Math.random() * 1.5
    });
  }

  setInterval(spawnEnemy, 900);

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Stars Background
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 15; i++) {
      ctx.fillRect((i * 47) % canvas.width, (Date.now() / 20 + i * 30) % canvas.height, 2, 2);
    }

    // Draw Ship
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.moveTo(ship.x, ship.y - ship.size / 2);
    ctx.lineTo(ship.x - ship.size / 2, ship.y + ship.size / 2);
    ctx.lineTo(ship.x + ship.size / 2, ship.y + ship.size / 2);
    ctx.closePath();
    ctx.fill();

    // Lasers
    for (let l = lasers.length - 1; l >= 0; l--) {
      const laser = lasers[l];
      laser.y -= laser.speed;

      ctx.fillStyle = '#ffe600';
      ctx.fillRect(laser.x - 2, laser.y, 4, 10);

      if (laser.y < 0) lasers.splice(l, 1);
    }

    // Enemies
    for (let e = enemies.length - 1; e >= 0; e--) {
      const enemy = enemies[e];
      enemy.y += enemy.speed;

      ctx.fillStyle = '#8a2be2';
      ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2, enemy.size, enemy.size);

      // Check collision with lasers
      for (let l = lasers.length - 1; l >= 0; l--) {
        const laser = lasers[l];
        const dist = Math.hypot(laser.x - enemy.x, laser.y - enemy.y);
        if (dist < enemy.size / 2 + 4) {
          score++;
          scoreText.textContent = score;
          enemies.splice(e, 1);
          lasers.splice(l, 1);
          break;
        }
      }

      if (enemy.y > canvas.height + 20) enemies.splice(e, 1);
    }

    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>
